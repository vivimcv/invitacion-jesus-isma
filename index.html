<script>
  // ========= CONFIG (edita aquí) =========
  const CONFIG = {
    emailEndpoint: "https://formspree.io/f/XXXXYYYY", // cámbialo cuando Formspree te lo dé

    celebrantName: "Jesús Ismael",
    message: `Anticipa tus compras, no queremos que te pierdas la diversión buscando una tienda.
La invitación es para ti +1 persona, si vas a invitar a otra persona, avísame, cero mala copas.
Solo te pediremos una cooperación de 50 pesos.
¡Espero poder verte! 🕷️🎉`,

    start: new Date(2026, 3, 4, 13, 0, 0), // Abril=3
    durationMinutes: 180,

    dateText: "Sábado 04 de abril",
    timeText: "1:00 PM",
    placeText: "Embarcadero Las Flores Nativitas",
    addressText: "Canal 236, San Jerónimo, Xochimilco, 16090 Ciudad de México, CDMX",

    hosts: {
      jesus: { emoji: "🕷️", showWeb: true },
      vivi:  { emoji: "🕸️", showWeb: true }
    }
  };

  // ========= Helpers =========
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");

  function toast(msg){
    $("toastMsg").textContent = msg;
    $("toast").style.display = "flex";
    clearTimeout(toast._t);
    toast._t = setTimeout(() => $("toast").style.display = "none", 2600);
  }

  function formatDateTime(d){
    return d.toLocaleString("es-MX", {
      weekday:"long", year:"numeric", month:"long", day:"numeric",
      hour:"numeric", minute:"2-digit"
    });
  }

  function cleanPhoneDigits(s){
    return (s || "").replace(/\D/g, "");
  }

  function getHostFromURL(){
    const params = new URLSearchParams(window.location.search);
    const host = (params.get("host") || "").toLowerCase().trim();
    return host || "vivi";
  }

  // ========= UI: Host customization =========
  function applyHostCustomization(){
    const hostKey = getHostFromURL();
    const hostData = CONFIG.hosts[hostKey];
    if(!hostData) return;

    const titleEl = document.querySelector("h1 .swing");
    if(titleEl) titleEl.textContent = `${hostData.emoji} Invitación a mi cumple`;

    const webEl = document.querySelector(".webbg");
    if(webEl && !hostData.showWeb) webEl.style.display = "none";
  }

  // ========= Asistencia =========
  function isAttending(){
    return $("attendYes")?.checked === true;
  }

  function updateAttendUI(){
    const note = $("attendNote");
    if(!note) return;

    if(isAttending()){
      note.textContent = "😎 Llena tus datos y confirma tu registro.";
    }else{
      note.textContent = "Gracias por avisar 🙌 No se enviará registro.";
    }
  }

  // ========= Form dinámico =========
  function renderGuestNameInputs(){
    const wrap = $("guestNamesWrap");
    if(!wrap) return;

    const n = parseInt($("guests")?.value || "1", 10) || 1;
    wrap.innerHTML = "";

    for(let i=1; i<=n; i++){
      const label = document.createElement("label");
      label.className = "k";
      label.setAttribute("for", `guestN${i}`);
      label.textContent = `Nombre invitad@ ${i}`;

      const input = document.createElement("input");
      input.id = `guestN${i}`;
      input.placeholder = i === 1 ? "Ej. Ismael" : "Ej. Acompañante";

      wrap.appendChild(label);
      wrap.appendChild(input);
    }
  }

  function isFormReady(){
    const registro = ($("guestName")?.value || "").trim();
    const phone = ($("guestPhone")?.value || "").trim();
    const count = parseInt($("guests")?.value || "1", 10) || 1;

    if(!registro) return false;
    if(!phone) return false;

    for(let i=1; i<=count; i++){
      const v = ($(`guestN${i}`)?.value || "").trim();
      if(!v) return false;
    }
    return true;
  }

  function updateRsvpVisibility(){
    const wrap = $("rsvpWrap");
    if(!wrap) return;

    if(!isAttending()){
      wrap.style.display = "none";
      return;
    }

    wrap.style.display = isFormReady() ? "block" : "none";
  }

  // ========= Confirmación (recuadro + copiar) =========
  function showConfirmationBox(text){
    const box = $("confirmBox");
    const prev = $("confirmPreview");
    if(!box || !prev) return;

    prev.textContent = text;
    box.style.display = "block";
  }

  async function copyText(text){
    try{
      await navigator.clipboard.writeText(text);
      toast("Confirmación copiada ✅");
    }catch{
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      toast("Confirmación copiada ✅");
    }
  }

  // ========= Construir mensaje =========
  function buildRsvpMessage(){
    const hostKey = getHostFromURL();

    const registro = ($("guestName")?.value || "").trim();
    const phone = cleanPhoneDigits($("guestPhone")?.value || "");
    const count = $("guests")?.value || "1";
    const note = ($("note")?.value || "").trim();

    const names = [];
    const n = parseInt(count, 10) || 1;
    for(let i=1; i<=n; i++){
      const v = ($(`guestN${i}`)?.value || "").trim();
      if(v) names.push(v);
    }

    const registroFinal = registro || names[0] || "Invitad@";

    let msg =
`📩 Registro de invitación
Recibiste la invitación de: ${hostKey.toUpperCase()}
Registro: ${registroFinal}
Número: ${phone ? phone : "No proporcionado"}
Invitados: ${count}
Nombre(s) invitado(s): ${names.length ? names.join(" / ") : "No proporcionado"}
Asistencia: ${isAttending() ? "✅ Sí" : "❌ No"}
📅 ${formatDateTime(CONFIG.start)}
📍 ${CONFIG.placeText} (${CONFIG.addressText})`;

    if(note) msg += `\n📝 Nota: ${note}`;
    return msg;
  }

  // ========= Countdown + barra =========
  function tick(){
    const now = new Date();
    const diff = CONFIG.start - now;

    // barra (aprox desde hoy -> evento)
    const totalTime = CONFIG.start - new Date(2025, 11, 1);
    const progress = Math.max(0, Math.min(100, (diff / totalTime) * 100));
    const bar = $("energyBar");
    if(bar) bar.style.width = progress + "%";

    if(diff <= 0){
      $("d").textContent = "00";
      $("h").textContent = "00";
      $("m").textContent = "00";
      $("s").textContent = "00";
      $("countNote").textContent = "¡Hoy es el día! 🥳🕷️";
      $("badgeText").textContent = "¡Es hoy!";
      return;
    }

    const sec = Math.floor(diff/1000);
    const days = Math.floor(sec / 86400);
    const hours = Math.floor((sec % 86400) / 3600);
    const mins = Math.floor((sec % 3600) / 60);
    const secs = sec % 60;

    $("d").textContent = pad(days);
    $("h").textContent = pad(hours);
    $("m").textContent = pad(mins);
    $("s").textContent = pad(secs);
    $("countNote").textContent = `Faltan ${days} día(s) para la misión 🕸️`;
  }

  // ========= Init (Render + listeners) =========
  (function init(){
    // Render base
    $("message").textContent = CONFIG.message;
    $("nameText").textContent = CONFIG.celebrantName;
    $("dateText").textContent = CONFIG.dateText;
    $("timeText").textContent = CONFIG.timeText;
    $("placeText").textContent = CONFIG.placeText;
    $("addressText").textContent = CONFIG.addressText;
    $("footer").textContent = "Evento: " + formatDateTime(CONFIG.start);

    applyHostCustomization();

    // Links
    const mapsQuery = encodeURIComponent(`${CONFIG.placeText} ${CONFIG.addressText}`);
    $("mapsBtn").href = `https://www.google.com/maps/search/?api=1&query=${mapsQuery}`;
    $("musicBtn").href = "https://www.youtube.com/watch?v=ApXoWvfEYVU";

    // Form dynamic
    renderGuestNameInputs();

    // Listeners form
    $("guests")?.addEventListener("change", ()=>{
      renderGuestNameInputs();
      updateRsvpVisibility();
    });

    ["guestName","guestPhone","note"].forEach(id=>{
      $(id)?.addEventListener("input", updateRsvpVisibility);
    });

    document.addEventListener("input", (e)=>{
      if(e.target && String(e.target.id).startsWith("guestN")) updateRsvpVisibility();
    });

    // asistencia
    $("attendYes")?.addEventListener("change", ()=>{
      updateAttendUI();
      updateRsvpVisibility();
    });
    $("attendNo")?.addEventListener("change", ()=>{
      updateAttendUI();
      updateRsvpVisibility();
    });
    updateAttendUI();
    updateRsvpVisibility();

    // Copiar confirmación
    $("copyConfirmBtn")?.addEventListener("click", ()=>{
      const text = $("confirmPreview")?.textContent || "";
      if(text) copyText(text);
    });

    // Enviar registro (email)
    $("rsvpBtn")?.addEventListener("click", async ()=>{
      if(!isAttending()){
        toast("Marcaste que no asistes. No se enviará registro.");
        return;
      }

      const msg = buildRsvpMessage();
      showConfirmationBox(msg);

      // Si todavía no tienes endpoint real, no mandes nada:
      if(!CONFIG.emailEndpoint || CONFIG.emailEndpoint.includes("XXXXYYYY")){
        toast("⚠️ Falta configurar Formspree.");
        return;
      }

      const data = new FormData();
      data.append("mensaje", msg);
      data.append("host", getHostFromURL());
      data.append("registro", ($("guestName").value || "").trim());
      data.append("telefono", ($("guestPhone").value || "").trim());
      data.append("invitados", $("guests").value);

      try{
        const res = await fetch(CONFIG.emailEndpoint, {
          method: "POST",
          body: data,
          headers: { "Accept": "application/json" }
        });

        if(res.ok){
          toast("✅ Registro enviado por correo");
        }else{
          toast("⚠️ No se pudo enviar. Intenta de nuevo.");
        }
      }catch{
        toast("⚠️ Sin conexión o error enviando el registro.");
      }
    });

    // Countdown
    tick();
    setInterval(tick, 1000);

    // Calendario
    function toICSDate(d){
      const z = new Date(d.getTime() - d.getTimezoneOffset()*60000);
      return z.toISOString().replace(/[-:]/g,"").split(".")[0] + "Z";
    }

    $("icsBtn")?.addEventListener("click", ()=>{
      const start = CONFIG.start;
      const end = new Date(start.getTime() + CONFIG.durationMinutes*60000);
      const uid = (crypto?.randomUUID ? crypto.randomUUID() : Date.now()+"@spiderman");

      const ics =
`BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//Invitacion Jesús Isma//ES
CALSCALE:GREGORIAN
METHOD:PUBLISH
BEGIN:VEVENT
UID:${uid}
DTSTAMP:${toICSDate(new Date())}
DTSTART:${toICSDate(start)}
DTEND:${toICSDate(end)}
SUMMARY:Cumpleaños Spider-Man de ${CONFIG.celebrantName}
DESCRIPTION:${CONFIG.message.replace(/\n/g,"\\n")}
LOCATION:${CONFIG.placeText} - ${CONFIG.addressText}
END:VEVENT
END:VCALENDAR`;

      const blob = new Blob([ics], {type:"text/calendar;charset=utf-8"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Cumple_SpiderMan_${CONFIG.celebrantName}.ics`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast("Calendario descargado 📅");
    });
  })();
</script>
